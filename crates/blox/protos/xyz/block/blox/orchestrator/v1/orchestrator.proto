// ErrorReason qualifies a Connect error with a domain-level reason, beyond
// the generic Connect code. It lets clients distinguish backend-issued errors
// from HTTP errors produced by upstream proxies (Cloudflare Access, WARP,
// etc.) which connect-es maps to the same Connect code.
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;

  // The caller is authenticated but the workstation they requested is owned
  // by a different user. Paired with Connect code PermissionDenied.
  ERROR_REASON_WORKSTATION_OWNERSHIP_DENIED = 1;

  // The caller is authenticated but lacks admin privileges required for the
  // requested operation. Paired with Connect code PermissionDenied.
  ERROR_REASON_ADMIN_ACCESS_DENIED = 2;

  // The caller's GitHub OAuth connection is missing, expired, or revoked and
  // must be re-established via onboarding/settings. Paired with Connect code
  // FailedPrecondition.
  ERROR_REASON_GITHUB_AUTH_REQUIRED = 3;

  // The caller's STS delegation is missing or expired and must be re-approved
  // via settings. Paired with Connect code FailedPrecondition.
  ERROR_REASON_STS_AUTH_REQUIRED = 4;

  // The caller has not completed Blox onboarding (user record or initial
  // GitHub authentication missing) and must run the onboarding flow. Paired
  // with Connect code FailedPrecondition.
  ERROR_REASON_ONBOARDING_REQUIRED = 5;

  // Snapshot policy disables snapshots for this workstation. Paired with
  // Connect code FailedPrecondition; shutdown snapshots may safely skip.
  ERROR_REASON_SNAPSHOTS_DISABLED = 6;
}

// BloxErrorInfo is attached as a Connect error detail to carry a typed reason
// alongside the generic Connect code. See ErrorReason.
message BloxErrorInfo {
  ErrorReason reason = 1;
}

// ============================================================================
// Post-Start Clone Registration (pod-to-pod routing target)
// ============================================================================

message RegisterPostStartCloneRequest {
  int64 workstation_id = 1;
  string working_dir = 2;
  string source = 3;
  string git_commit = 4;
  bool cachew_used = 5;
  optional int32 requested_cpu = 6;
  optional int32 requested_memory_gb = 7;
}

enum PostStartCloneResizeStatus {
  POST_START_CLONE_RESIZE_STATUS_UNSPECIFIED = 0;
  POST_START_CLONE_RESIZE_STATUS_NOT_REQUESTED = 1;
  POST_START_CLONE_RESIZE_STATUS_APPLIED = 2;
  POST_START_CLONE_RESIZE_STATUS_PENDING = 3;
  POST_START_CLONE_RESIZE_STATUS_NEEDS_REPROVISION = 4;
  POST_START_CLONE_RESIZE_STATUS_FAILED = 5;
}

message RegisterPostStartCloneResponse {
  PostStartCloneResizeStatus resize_status = 1;
  string resize_message = 2;
  int32 desired_cpu = 3;
  int32 desired_memory_gb = 4;
  int32 applied_cpu = 5;
  int32 applied_memory_gb = 6;
}

message DeliverPendingBootstrapRequest {
  int64 workstation_id = 1;
}

message DeliverPendingBootstrapResponse {}

message SnapshotWorkstationRequest {
  int64 workstation_id = 1;
  // Human-readable reason for the snapshot, used only for logging.
  string reason = 2;
  // Preserved when forwarding so timeout and callback reports share an alert group.
  string attempt_id = 3;
}

message SnapshotWorkstationResponse {}
