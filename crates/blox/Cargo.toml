[package]
name = "blox"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
pbjson = "0.9"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"

[build-dependencies]
pbjson-build = "0.9"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
tiny_http = "0.12"
