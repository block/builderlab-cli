[package]
name = "builderlab-auth"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
publish = false

[features]
default = []
blocking-client = ["dep:reqwest", "dep:base64", "dep:getrandom"]

[dependencies]
anyhow = "1"
base64 = { version = "0.22", optional = true }
getrandom = { version = "0.4", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
url = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework-sys = { version = "2.14", default-features = false }
