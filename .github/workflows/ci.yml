name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal --component clippy --component rustfmt

      - name: Install just
        run: cargo +1.91.1 install just --locked

      - name: Run repository CI
        run: just ci
