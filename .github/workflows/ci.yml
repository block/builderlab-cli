name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  FORCE_COLOR: "1"

jobs:
  ci:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target

      # Public GitHub runners cannot read Block's private hermit-packages repo.
      # Use the pinned repository toolchain until Actions access is provisioned.
      - name: Install Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal --component clippy --component rustfmt

      - name: Install just
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: just@1.48.0

      - name: Run repository CI
        run: just ci
